[loggers]
keys=root

[handlers]
keys=file, console

[formatters]
keys=resume

[logger_root]
level=INFO
handlers=file, console

[handler_file]
class=logging.handlers.RotatingFileHandler
level=INFO
encoding=utf-8
formatter=resume
args=('log/weibo.log', 'a', 10000000, 50, 'utf-8')

[handler_console]
class=StreamHandler
level=INFO
formatter=resume
args=(sys.stdout,)

[formatter_resume]
format=[%(asctime)s.%(msecs)03d][%(levelname)s](%(filename)s#%(lineno)d): %(message)s
datefmt=%Y-%m-%d %H:%M:%S
class=logging.Formatter